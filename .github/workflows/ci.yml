name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Los extremos del rango declarado en pyproject.toml. Probar el mínimo
        # soportado evita que se cuele sintaxis que rompa a quien esté en 3.9.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar el paquete
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest

      - name: Forge se diagnostica a sí mismo
        run: forge doctor --strict --path .
